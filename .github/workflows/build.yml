# Builds the static site from the public CONTENT repository, publishes it to GitHub Pages (the public
# site, affluxseminar.org — GitHub Pages is reachable from Russia, where Cloudflare-proxied sites are
# throttled) and deploys the application server from THIS repository (the admin,
# admin.affluxseminar.org, a Cloudflare Worker). The content repository holds no credential and
# cannot reach this one: this workflow polls it every 10 minutes and deploys when the live site's
# content-version differs from the repository's latest commit, or on a push here, or on demand.
# The live site itself is the record of what is deployed — not a cache.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts, Workers Routes, DNS, this account and zone), CLOUDFLARE_ACCOUNT_ID.
# Repository variables: CONTENT_REPO (affluxseminar/afflux-content), SITE_URL (https://affluxseminar.org).
# GitHub Pages: Settings → Pages → Source "GitHub Actions", custom domain affluxseminar.org, HTTPS enforced.
# The "production" environment is configured with a deployment-branch rule for main; the YAML only
# names it. A passkey on the owner's account is what makes "owner only" true.
name: Build, test and deploy
on:
  push:
    branches: [main]
    paths-ignore: [tools/cf-setup.run]
  schedule:
    - cron: "*/10 * * * *"
    # Nightly rebuild at about 03:00 Moscow time (00:07 UTC), even when nothing changed: a seminar
    # that has taken place moves from Upcoming to the Archive without anyone saving anything.
    - cron: "7 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  content:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: sha
        run: |
          sha=$(git ls-remote "https://github.com/${{ vars.CONTENT_REPO }}.git" refs/heads/main | cut -f1)
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "could not read the content repository"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: cmp
        run: |
          live=$(curl -sf --max-time 15 "${{ vars.SITE_URL }}/content-version.txt" | tr -d '[:space:]' || true)
          # A scheduled run deploys only when the live site answers with a different content version;
          # while the site is not up yet (or unreachable) the schedule does nothing — the first deploy
          # comes from a push or "Run workflow". Pushes and manual runs always build.
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 0 * * *" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$live" ] && [ "$live" != "${{ steps.sha.outputs.sha }}" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: content
    if: needs.content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          ref: ${{ needs.content.outputs.sha }}
          path: content
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build from the selected content (validates photos, links, symlinks)
        run: node build.mjs --content content --content-sha ${{ needs.content.outputs.sha }}
      - run: npm ci
        working-directory: server
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars.dev && npm run migrate:local
        working-directory: server
      - name: End-to-end checks against the local Worker
        run: |
          (node test/mock-services.mjs > mock.log 2>&1 &)
          (npx wrangler dev --env dev --local --port 8788 --test-scheduled > wrangler.log 2>&1 &)
          for i in $(seq 1 40); do sleep 2; curl -sf http://localhost:8788/api/health && break; done
          python test/e2e.py
        working-directory: server
      - name: Key-rotation rehearsal (disposable local data)
        run: python test/rotation.py --disposable 600
        working-directory: server

  # The public site: GitHub Pages. The same build the admin was tested with.
  pages:
    needs: [content, test]
    if: needs.content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          ref: ${{ needs.content.outputs.sha }}
          path: content
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build.mjs --content content --content-sha ${{ needs.content.outputs.sha }}
      - run: echo "affluxseminar.org" > dist/CNAME
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4

  # The admin: the Worker on admin.affluxseminar.org.
  deploy:
    needs: [content, test]
    if: needs.content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO }}
          ref: ${{ needs.content.outputs.sha }}
          path: content
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build.mjs --content content --content-sha ${{ needs.content.outputs.sha }}
      - run: npm ci
        working-directory: server
      - run: npx wrangler deploy --env ""
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
